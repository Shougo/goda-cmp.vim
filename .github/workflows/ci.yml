name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go the module supports, and the newest.
        go: ['1.26', 'stable']
    defaults:
      run:
        working-directory: goda-cmp.vim
    steps:
      # The end-to-end tests expect goda.vim next to goda-cmp.vim, and run
      # with its latest version.
      - uses: actions/checkout@v7.0.1
        with:
          path: goda-cmp.vim
      - uses: actions/checkout@v7.0.1
        with:
          repository: Shougo/goda.vim
          path: goda.vim
      # pum.vim itself, for the pum scenarios (in the editors new enough for
      # it; the others use the stand-in only).
      - uses: actions/checkout@v7.0.1
        with:
          repository: Shougo/pum.vim
          path: pum.vim
      # The end-to-end tests run in every editor they find.
      - name: Install Vim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          version: stable
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: stable
      # For ext/source/shellnative.
      - name: Install zsh
        run: sudo apt-get install -y zsh
      # After the editors: installing them may put a directory with the
      # runner's own, older Go first in PATH.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: goda-cmp.vim/go.sum
      # For ext/source/lsp.
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest
        env:
          # setup-go sets GOTOOLCHAIN=local, which would refuse the newer Go
          # the latest gopls needs.
          GOTOOLCHAIN: auto
      - run: go version && vim --version | head -n 3 && nvim --version | head -n 1 && gopls version
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race ./...
        env:
          GODA_CMP_PUM: ${{ github.workspace }}/pum.vim

  # Windows and macOS: vet and the tests that need no editor, shell or
  # language server (-short; those run on Linux above).
  other:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # Keep the line endings of the repository (the embedded Vim and shell
      # scripts, and gofmt on Linux).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go test -short ./...
