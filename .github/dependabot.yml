# Dependabot: updates of the GitHub Actions and of the Go modules, once a
# week, of releases at least 7 days old (time for a broken or malicious
# release to be found), all in one pull request (one for each conflicted
# with the others in go.mod and go.sum, and they were many).
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # Our own modules: at once.
      exclude:
        - github.com/Shougo/*
  # The end-to-end tests: a module of their own.
  - package-ecosystem: gomod
    directory: /e2e
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - github.com/Shougo/*
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
